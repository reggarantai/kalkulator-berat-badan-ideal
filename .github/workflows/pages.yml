name: Tes & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit test
        run: npm test
      - name: Pasang Chromium untuk tes browser
        run: npx playwright install --with-deps chromium
      - name: Tes browser
        run: npm run test:e2e
      - name: Simpan laporan tes browser
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: laporan-tes-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: tes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Kumpulkan file situs
        run: mkdir _site && cp -r index.html sw.js manifest.webmanifest assets _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
